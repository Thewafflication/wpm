name: Set up latest WPM, TinyCC, and WCRT
description: Bootstrap WPM and install TinyCC plus the architecture-matched WCRT package

inputs:
  architecture:
    description: Target WCRT architecture (x86, x64, or arm64)
    required: true

runs:
  using: composite
  steps:
    - name: Install latest WPM, TinyCC, and WCRT
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $bootstrap = Join-Path $env:RUNNER_TEMP 'wpm-install.cmd'
        Invoke-WebRequest -UseBasicParsing `
          -Uri 'https://github.com/Thewafflication/wpm/releases/latest/download/install.cmd' `
          -OutFile $bootstrap
        & $bootstrap
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        $wpm = Join-Path $env:ProgramFiles 'WPM\wpm.exe'
        if (-not (Test-Path -LiteralPath $wpm)) {
          throw "The latest WPM release was not installed at $wpm."
        }
        & $wpm repo add 'https://github.com/Thewafflication/tcc_package/releases/latest/download'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & $wpm config set prerelease true --package tinycc
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        $tinyccPublicKey = Join-Path $env:RUNNER_TEMP 'tinycc-wpm-release.public'
        Invoke-WebRequest -UseBasicParsing `
          -Uri 'https://github.com/Thewafflication/tcc_package/releases/latest/download/wpm-release.public' `
          -OutFile $tinyccPublicKey
        & $wpm trust add $tinyccPublicKey
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        & $wpm install tinycc
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        & $wpm repo add 'https://github.com/Thewafflication/wcrt/releases/latest/download'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        $wcrtPublicKey = Join-Path $env:RUNNER_TEMP 'wcrt-wpm-release.public'
        Invoke-WebRequest -UseBasicParsing `
          -Uri 'https://github.com/Thewafflication/wcrt/releases/latest/download/wpm-release.public' `
          -OutFile $wcrtPublicKey
        & $wpm trust add $wcrtPublicKey
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        & $wpm install wcrt --arch '${{ inputs.architecture }}'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        $tinyccRoot = Get-ChildItem (Join-Path $env:ProgramFiles 'TinyCC') `
          -Directory -ErrorAction Stop |
          Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'tcc.exe') } |
          Sort-Object Name -Descending |
          Select-Object -First 1 -ExpandProperty FullName
        if (-not $tinyccRoot) {
          throw 'The TinyCC WPM package did not install a usable toolchain.'
        }

        $wcrtRoot = Get-ChildItem (Join-Path $env:ProgramFiles 'WCRT') `
          -Directory -ErrorAction Stop |
          Where-Object {
            (Test-Path -LiteralPath (Join-Path $_.FullName 'bin\wcrt.dll')) -and
            (Test-Path -LiteralPath (Join-Path $_.FullName 'include\stdio.h')) -and
            (Test-Path -LiteralPath (Join-Path $_.FullName 'lib\wcrt.def'))
          } |
          Sort-Object Name -Descending |
          Select-Object -First 1 -ExpandProperty FullName
        if (-not $wcrtRoot) {
          throw 'The WCRT WPM package did not install a usable runtime SDK.'
        }

        $expectedMachine = @{
          x86 = 0x014c
          x64 = 0x8664
          arm64 = 0xaa64
        }['${{ inputs.architecture }}']
        $wcrtDll = Join-Path $wcrtRoot 'bin\wcrt.dll'
        $stream = [IO.File]::OpenRead($wcrtDll)
        $reader = [IO.BinaryReader]::new($stream)
        try {
          $stream.Position = 0x3c
          $stream.Position = $reader.ReadInt32() + 4
          $actualMachine = $reader.ReadUInt16()
        } finally {
          $reader.Dispose()
          $stream.Dispose()
        }
        if ($actualMachine -ne $expectedMachine) {
          throw "WCRT architecture mismatch for ${{ inputs.architecture }}: PE machine 0x$($actualMachine.ToString('x4'))."
        }

        $ninjaCommand = Get-Command ninja -ErrorAction SilentlyContinue
        if ($ninjaCommand) {
          $ninja = $ninjaCommand.Source
        } else {
          $ninja = Get-ChildItem $env:ProgramFiles -Recurse -Filter ninja.exe `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
        }
        if (-not $ninja) {
          throw 'Ninja was not found on the GitHub runner.'
        }

        & $wpm --version
        & (Join-Path $tinyccRoot 'tcc.exe') -v
        (Get-Item -LiteralPath (Join-Path $wcrtRoot 'bin\wcrt.dll')).VersionInfo.FileVersion
        & $ninja --version
        "WPM_TCC_ROOT=$tinyccRoot" | Out-File $env:GITHUB_ENV -Append
        "WPM_WCRT_ROOT=$wcrtRoot" | Out-File $env:GITHUB_ENV -Append
        "WPM_NINJA=$ninja" | Out-File $env:GITHUB_ENV -Append
